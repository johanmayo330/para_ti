<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no">
  <title>Galaxia de Flores Azules</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600">
      <!-- Musica: CAMBIA cancion.mp3 por el nombre de tu archivo -->

</head>

<body>

  <div id="container"></div>

  <div id="intro">
    <div id="meta">&#128153;</div>

    <svg id="arco" width="100%" height="100%">
      <defs>
        <g id="flechaForma">
          <line x1="-6" y1="0" x2="112" y2="0" class="asta"/>
          <polygon points="108,-8 130,0 108,8" class="punta"/>
          <line x1="-6" y1="0" x2="-20" y2="-9" class="asta"/>
          <line x1="4" y1="0" x2="-10" y2="-9" class="asta"/>
          <line x1="-6" y1="0" x2="-20" y2="9" class="asta"/>
          <line x1="4" y1="0" x2="-10" y2="9" class="asta"/>
        </g>
      </defs>
      <g id="arcoG">
        <path d="M -25 -65 Q 40 0 -25 65" class="madera"/>
        <polyline id="cuerda" class="cuerda"
          points="-25,-65 -25,0 -25,65"/>
        <use id="flecha" href="#flechaForma"/>
      </g>
      <use id="vuelo" href="#flechaForma"
        visibility="hidden"/>
    </svg>

    <p id="pista">Ojalá te saque una sonrisa, lo hice con todo mi corazón</p>
  </div>

  <div id="modalCarta">
    <img id="cartaImg" src="" alt="Carta">
    <button id="cerrarModal">Cerrar</button>
  </div>

  <script
    src="https://unpkg.com/three@0.147.0/build/three.min.js">
  </script>
  <script
    src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js">

  <script src="script.js"></script>

</html>
